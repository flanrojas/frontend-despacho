name: CI/CD Front Despacho

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }} \
            -t front-despacho .

      - name: Tag image
        run: docker tag front-despacho:latest ${{ vars.ECR_REPO_URL }}:latest

      - name: Push image
        run: docker push ${{ vars.ECR_REPO_URL }}:latest

      - name: Deploy on EC2 via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_PUBLIC_IP }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            aws ecr get-login-password --region ${{ vars.AWS_REGION }} \
              | docker login --username AWS --password-stdin $(echo "${{ vars.ECR_REPO_URL }}" | cut -d/ -f1)
            docker pull ${{ vars.ECR_REPO_URL }}:latest
            docker stop front-despacho || true
            docker rm front-despacho || true
            docker run -d --name front-despacho -p 3000:80 ${{ vars.ECR_REPO_URL }}:latest
